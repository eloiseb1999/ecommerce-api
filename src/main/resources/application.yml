server:
  port: 8080

spring:
  application:
    name: ecommerce-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ecommerce_db}

app:
  jwt:
    secret: ${JWT_SECRET:troqueEstaChaveSecretaPorUmaBemMaiorEAleatoriaAntesDeIrParaProducao1234567890}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 horas
  seed-data: ${SEED_DATA:true} # cria usuario admin e categorias de exemplo ao iniciar

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.portfolio.ecommerce: INFO
    org.springframework.security: WARN
